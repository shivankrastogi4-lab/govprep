{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block page_id %}admin{% endblock %}

{% block content %}
<section style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:48px;width:100%;max-width:420px">
    <div style="text-align:center;margin-bottom:32px">
      <div style="font-size:2.5rem;margin-bottom:12px">🔐</div>
      <h1 style="font-size:1.6rem;margin-bottom:6px">Admin Panel</h1>
      <p style="color:var(--text3);font-size:0.88rem">GovPrep India Dashboard</p>
    </div>

    {% if error %}
    <div style="background:rgba(230,57,70,0.1);border:1px solid rgba(230,57,70,0.3);border-radius:8px;padding:12px 16px;margin-bottom:20px;font-size:0.88rem;color:var(--red)">
      ❌ {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/admin/login">
      <div style="margin-bottom:16px">
        <label style="display:block;font-size:0.82rem;font-weight:700;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.06em">Password</label>
        <input type="password" name="password" placeholder="Enter admin password"
          style="width:100%;padding:12px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'Nunito',sans-serif;font-size:0.95rem;outline:none;transition:border-color 0.2s"
          onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'"
          autofocus>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;font-size:1rem;padding:13px">
        Login to Admin →
      </button>
    </form>

    <div style="text-align:center;margin-top:20px">
      <a href="/" style="font-size:0.82rem;color:var(--text3)">← Back to website</a>
    </div>
  </div>
</section>
{% endblock %}
